# Sextant iOS app. Generate Sextant.xcodeproj with XcodeGen on macOS (CI does this).
name: Sextant

configs:
  Debug: debug
  Release: release

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Sextant:
    type: application
    platform: iOS
    sources:
      - path: Sources/Sextant
        excludes:
          - "Web/**"
      # The web interface is copied into the bundle as a folder (Web/index.html).
      - path: Sources/Sextant/Web
        type: folder
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Sextant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Sextant listens to your guitar to check whether you are playing the right chord."
        NSLocalNetworkUsageDescription: "Sextant connects to the Kılavuz app on your computer to find and analyse songs."
        # Kılavuz on the computer is reached over plain HTTP on the home network (its own pairing key protects it).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.batuhxn.sextant.pair
            CFBundleURLSchemes: [sextant]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhxn.sextant
        PRODUCT_NAME: Sextant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "NO"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  # Unit tests: not hosted. The bundle compiles the app's pure logic files itself
  # (DSP, HTTP parsing, routing helpers), so tests never launch the app.
  SextantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/Sextant/Core
      - path: Tests/SextantTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhxn.sextant.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  Sextant:
    build:
      targets:
        Sextant: all
        SextantTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SextantTests
    archive:
      config: Release
